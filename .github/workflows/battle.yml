name: Phantasmoon Battle

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Match seed"
        required: true
        default: "424242"
        type: string
      cycles:
        description: "Cycles"
        required: true
        default: "8000000"
        type: string

permissions:
  contents: read

jobs:
  battle:
    name: Run battle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BATTLE_SEED: ${{ inputs.seed }}
      BATTLE_CYCLES: ${{ inputs.cycles }}
      EXPECTED_EVALUATOR_SHA256: 2B2DA7E8CBBA1C9D16D6626C5BAB7560ED4AD298689A016A4F5E1A38CB28EAF4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check inputs
        shell: bash
        run: |
          set -euo pipefail

          test -f Dockerfile.dev
          test -f phantasmoon-gui
          test -f play/aek-warehouse_bot.s
          test -f play/challenger.s

          test ! -L play/aek-warehouse_bot.s
          test ! -L play/challenger.s

          case "$BATTLE_SEED" in
            ''|*[!0-9]*)
              echo "Seed must contain digits only."
              exit 1
              ;;
          esac

          case "$BATTLE_CYCLES" in
            ''|*[!0-9]*)
              echo "Cycles must contain digits only."
              exit 1
              ;;
          esac

          if (( BATTLE_SEED > 2147483647 )); then
            echo "Seed is too large."
            exit 1
          fi

          if (( BATTLE_CYCLES < 1 || BATTLE_CYCLES > 8000000 )); then
            echo "Cycles must be between 1 and 8000000."
            exit 1
          fi

          if (( $(wc -c < play/aek-warehouse_bot.s) > 262144 )); then
            echo "aek-warehouse_bot.s exceeds 256 KiB."
            exit 1
          fi

          if (( $(wc -c < play/challenger.s) > 262144 )); then
            echo "challenger.s exceeds 256 KiB."
            exit 1
          fi

      - name: Verify evaluator
        shell: bash
        run: |
          set -euo pipefail

          actual="$(sha256sum phantasmoon-gui | awk '{print toupper($1)}')"
          expected="$(printf '%s' "$EXPECTED_EVALUATOR_SHA256" | tr '[:lower:]' '[:upper:]')"

          test "$actual" = "$expected"
          echo "Evaluator verified."

      - name: Build evaluator
        run: docker build --file Dockerfile.dev --tag phantasmoon-dev .

      - name: Validate AEK-Warehouse bot
        run: >-
          docker run --rm -e QT_QPA_PLATFORM=offscreen
          -v "${{ github.workspace }}:/workspace"
          phantasmoon-dev phantasmoon-gui
          --check /workspace/play/aek-warehouse_bot.s

      - name: Validate challenger
        run: >-
          docker run --rm -e QT_QPA_PLATFORM=offscreen
          -v "${{ github.workspace }}:/workspace"
          phantasmoon-dev phantasmoon-gui
          --check /workspace/play/challenger.s

      - name: Record provenance
        shell: bash
        run: |
          {
            echo "seed=$BATTLE_SEED"
            echo "cycles=$BATTLE_CYCLES"
            sha256sum \
              phantasmoon-gui \
              play/aek-warehouse_bot.s \
              play/challenger.s
          } > battle-provenance.txt

      - name: Run battle
        shell: bash
        run: |
          set -euo pipefail

          : > battle-results.txt
          : > battle-raw.txt

          log() {
            printf '%s\n' "$1" | tee -a battle-results.txt
          }

          field() {
            local line="$1"
            local key="$2"
            printf '%s\n' "$line" | sed -nE "s/.*${key}=([^ ]+).*/\1/p"
          }

          run_match() {
            local number="$1"
            local player0_name="$2"
            local player0_path="$3"
            local player1_name="$4"
            local player1_path="$5"

            local raw
            raw="$(
              docker run --rm -e QT_QPA_PLATFORM=offscreen \
                -v "${GITHUB_WORKSPACE}:/workspace" \
                phantasmoon-dev phantasmoon-gui --headless \
                --seed "$BATTLE_SEED" \
                --cycles "$BATTLE_CYCLES" \
                --bot0 "$player0_path" \
                --bot1 "$player1_path"
            )"

            {
              echo "===== MATCH $number RAW ====="
              echo "$raw"
              echo
            } >> battle-raw.txt

            local p0
            local p1
            local winner

            p0="$(printf '%s\n' "$raw" | grep '^player 0:' | tail -n 1)"
            p1="$(printf '%s\n' "$raw" | grep '^player 1:' | tail -n 1)"
            winner="$(printf '%s\n' "$raw" | grep '^winner:' | tail -n 1)"

            local winner_name="Unknown"

            case "$winner" in
              "winner: player 0")
                winner_name="$player0_name"
                ;;
              "winner: player 1")
                winner_name="$player1_name"
                ;;
            esac

            log "MATCH $number"
            log "$player0_name [P0]  score=$(field "$p0" score) | puzzles=$(field "$p0" puzzles_completed) | weight=$(field "$p0" carried_weight) | faulted=$(field "$p0" faulted)"
            log "$player1_name [P1]  score=$(field "$p1" score) | puzzles=$(field "$p1" puzzles_completed) | weight=$(field "$p1" carried_weight) | faulted=$(field "$p1" faulted)"
            log "Winner: $winner_name"
            log ""
          }

          log "============================================"
          log "PHANTASMOON BATTLE"
          log "Seed: $BATTLE_SEED | Cycles: $BATTLE_CYCLES"
          log "============================================"
          log ""

          run_match \
            "1" \
            "AEK-Warehouse" \
            "/workspace/play/aek-warehouse_bot.s" \
            "Challenger" \
            "/workspace/play/challenger.s"

          run_match \
            "2" \
            "Challenger" \
            "/workspace/play/challenger.s" \
            "AEK-Warehouse" \
            "/workspace/play/aek-warehouse_bot.s"

          log "============================================"
          log "BATTLE COMPLETE"
          log "============================================"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: phantasmoon-battle-results
          path: |
            battle-results.txt
            battle-raw.txt
            battle-provenance.txt
          retention-days: 14
